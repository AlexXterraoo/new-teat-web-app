<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailVPN Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-md space-y-4">
        
        <!-- Header -->
        <div class="glass-card rounded-2xl p-6 text-center">
            <div class="inline-block p-3 rounded-full bg-indigo-500/10 text-indigo-400 mb-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-wide">RailVPN Dashboard</h1>
            <p class="text-xs text-slate-400 mt-1">Connection & Traffic Management</p>
            
            <!-- Connection Status -->
            <div class="mt-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Status: Online & Stable
            </div>
        </div>

        <!-- iOS Widgets -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Used Traffic -->
            <div class="glass-card rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs text-slate-400">Used Traffic</span>
                <div class="my-2">
                    <span class="text-2xl font-black text-indigo-400">{{ used_traffic }}</span>
                    <span class="text-xs text-slate-400">of {{ total_traffic }}</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-700/50 h-2 rounded-full overflow-hidden">
                    <div class="bg-indigo-500 h-full rounded-full" style="width: {{ traffic_percent }}%"></div>
                </div>
            </div>

            <!-- Remaining Days -->
            <div class="glass-card rounded-2xl p-4 flex flex-col justify-between">
                <span class="text-xs text-slate-400">Time Remaining</span>
                <div class="my-2">
                    <span class="text-2xl font-black text-amber-400">{{ days_left }}</span>
                    <span class="text-xs text-slate-400">Days</span>
                </div>
                <span class="text-[10px] text-slate-400">Expires: {{ expire_date }}</span>
            </div>
        </div>

        <!-- Subscription Links -->
        <div class="glass-card rounded-2xl p-5 space-y-3">
            <h2 class="text-sm font-semibold text-slate-300">Subscription & Configs</h2>
            
            <!-- Copy Sub Link Button -->
            <button onclick="copySubLink('{{ sub_url }}')" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                </svg>
                Copy Subscription Link
            </button>

            <!-- Direct Import to v2rayNG -->
            <a href="v2rayng://install-config?url={{ sub_url }}" class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium text-sm transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                Add directly to v2rayNG
            </a>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs text-slate-500 pt-2">
            RailVPN Core &bull; Secured on Railway
        </div>

    </div>

    <script>
        function copySubLink(url) {
            navigator.clipboard.writeText(url);
            alert("Subscription link copied successfully!");
        }
    </script>
</body>
</html>
