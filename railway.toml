[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'xray -config /etc/xray/config.json & sleep 2 && uvicorn app:app --host 0.0.0.0 --port ${PORT:-8080}'"
restartPolicyType = "always"
healthcheckPath = "/health"
healthcheckTimeout = 30

[[deploy.ports]]
port = 8080
protocol = "tcp"
